<section class="card auth-card">
  <h1>Create your account</h1>
  <p class="muted">It takes a moment and your tasks stay private to you.</p>

  @if (errorMessage(); as message) {
    <p class="alert" role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="displayName">Name</label>
      <input
        id="displayName"
        type="text"
        formControlName="displayName"
        autocomplete="name"
        [attr.aria-invalid]="form.controls.displayName.touched && form.controls.displayName.invalid"
      />
      <app-field-error
        [control]="form.controls.displayName"
        [serverErrors]="fieldErrors()['displayName'] ?? []"
        label="Name"
      />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      <app-field-error
        [control]="form.controls.email"
        [serverErrors]="fieldErrors()['email'] ?? []"
        label="Email"
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      <p class="muted hint">At least 8 characters, including a letter and a digit.</p>
      <app-field-error
        [control]="form.controls.password"
        [serverErrors]="fieldErrors()['password'] ?? []"
        label="Password"
      />
    </div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="muted">Already have an account? <a routerLink="/login">Sign in</a></p>
</section>
